#################################
#          Backend              #
#################################
backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";

#################################
#          Shadows              #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'Polybar'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#           Blurring            #
#################################
blur: {
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = true;
}
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'rofi'"
];

#################################
#       Animations              #
#################################
animations = true;
animation-window-mass = 0.5;
animation-dampening = 25;
animation-clamping = true;
animation-stiffness = 200;
animation-delta = 10;

animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-for-transient-window = "slide-down";
animation-for-menu-window = "zoom";

#################################
#          Transition           #
#################################
transition-length = 300
transition-pow-x = 0.1
transition-pow-y = 0.1
transition-size = 300

#################################
#          Fading               #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 8;
fade-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Alacritty'"
];

#################################
#         Corners               #
#################################
corner-radius = 12;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'i3'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'"
];

#################################
#       Transparency            #
#################################
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;

opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'Rofi'",
  "95:class_g = 'Thunar'",
  "80:class_g = 'mpv'"
];

#################################
#       Advanced Options        #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = false;
inactive-dim = 0.05;

focus-exclude = [
  "class_g = 'Crow'",
  "class_g = 'polybar'",
  "class_g = 'Rofi'"
];

#################################
#          Window Types         #
#################################
wintypes:
{
  tooltip = { fade = true; shadow = false; };
  dropdown_menu = { opacity = 0.9; blur-background = true; };
  popup_menu = { opacity = 0.9; blur-background = true; };
  utility = { shadow = false; };
};
