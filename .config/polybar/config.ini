[colors]
background = ${xrdb:color0:#222}
foreground = ${xrdb:color1:#222}
foreground-alt = ${xrdb:color2:#222}
primary = ${xrdb:color3:#222}
secondary = ${xrdb:color4:#222}
alert = ${xrdb:color5:#222}
border = ${xrdb:color6:#222}
disabled = ${xrdb:color7:#222}

[bar/mybar]
wm-restack = i3
override-redirect = true

fixed-center = true
offset-x = 5%
offset-y = 0.5%

width = 90%
height = 18pt
radius = 12
;dpi = 150

background = ${colors.background}
foreground = ${colors.foreground}

;line-size = 3pt

;border-size = 3pt
;border-color = ${colors.border} 

;padding-left = 1
padding-right = 2

module-margin = 1 

separator = "" 
separator-foreground = ${colors.border}

font-0 = ComicShannsMono Nerd Font Propo:style=Bold;4 
font-1 = DejaVu Sans:style=Bold:size=10;4
font-2 = ONE PIECE:style=Regular:size=18;4

modules-left = xworkspaces xwindow 
modules-center = date 
modules-right = systray xkeyboard battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm


[module/wifi]
type = custom/script
exec = ~/.config/i3/scripts/wifi-status.sh
interval = 5
format-prefix = "%{F#FF0} "

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt
tray-foreground = ${colors.foreground}
tray-background = ${colors.background}

[module/xworkspaces]
type = internal/xworkspaces
format-radius = 20

label-active-font = 3
label-occupied-font = 3
label-urgent-font = 3
label-empty-font = 3

label-active = %name%
label-active-background = ${colors.border}
label-active-foreground = ${colors.background}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.background}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %{F#F0C674}%class:0:30:...%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
background = ${colors.background}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ACAD
pol-interval = 1

format-full = <label-full>
format-charging = <label-charging>
format-discharging = <label-discharging>
format-low = <label-low>

label-charging = %{F#00F} %percentage%%
label-full = %{F#0F0} FULL
label-low = %{F#F00} %percentage%%
label-discharging =  %percentage%%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %d.%m.%Y %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
